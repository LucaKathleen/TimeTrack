p3yp09KalcMeH9avup71GlYAaHKo5n96v6V+KfwBRXsTiveejNQAAAABJRU5ErkJggg==';const $=s=>document.querySelector(s),K='russian-srs-progress-v1',M='russian-srs-meta-v1',L='russian-srs-local-cards-v1',MIN=60000,DAY=86400000;const base=[{id:'a',de:'Ich hab keinen Bock zu kochen.',ru:'Мне влом готовить.',note:'влом = kein Bock'},{id:'b',de:'Mir ist mulmig, da allein hinzugehen.',ru:'Мне стрёмно туда идти одной.',note:'стрёмно = mulmig / sketchy'},{id:'c',de:'Ich hab auf der Arbeit Mist gebaut.',ru:'Я накосячила на работе.',note:'накосячить = Mist bauen'},{id:'d',de:'Warum gehst du mir so auf den Sack?',ru:'Чё ты до меня докопался?',note:'докопаться = nerven'},{id:'e',de:'Ich hab beschlossen, mir die Mühe zu machen und alles selbst zu machen.',ru:'Я решила заморочиться и сама всё сделать.',note:'заморочиться = sich Mühe machen'},{id:'f',de:'Ich kann darüber nicht mehr vor Lachen.',ru:'Я с этого угораю.',note:'угорать = sich kaputtlachen'},{id:'g',de:'Hör auf, dich rauszureden.',ru:'Хватит отмазываться.',note:'отмазываться = sich rausreden'},{id:'h',de:'Er ist mit seiner Lüge aufgeflogen.',ru:'Он спалился на лжи.',note:'спалиться = auffliegen'},{id:'i',de:'Was willst du mir da erzählen?',ru:'Что ты мне втираешь?',note:'втирать = Quatsch erzählen'},{id:'j',de:'Ich bin nach Hause gekommen und direkt weggepennt.',ru:'Я пришла домой и сразу вырубилась.',note:'вырубиться = wegpennen'}];const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};let p=load(K,{}),meta=load(M,{reviewsToday:0,reviewDay:''}),local=load(L,[]),cards=[...base,...local],cur=null,revealed=false;function pf(id){let x=p[id];return x&&x.state?x:{state:'learning',correctStreak:0,due:0,interval:0,ease:2.5,reviews:0,lapses:0}}function save(){localStorage.setItem(K,JSON.stringify(p));localStorage.setItem(M,JSON.stringify(meta))}function due(){return cards.filter(c=>pf(c.id).due<=Date.now()).sort((a,b)=>pf(a.id).due-pf(b.id).due)}function endToday(){let d=new Date();d.setHours(23,59,59,999);return d.getTime()}function todayOpen(){return cards.filter(c=>pf(c.id).due<=endToday())}function mood(){let open=todayOpen().length;$('#open').textContent=open;$('#today').textContent=meta.reviewsToday||0;if(open===0){$('#cat').src=P;$('#mood').textContent='Zufrieden';$('#speech').textContent='Mrrr… satt. Morgen wieder.'}else{$('#cat').src=H;$('#mood').textContent='Hungrig';$('#speech').textContent='Noch '+open+' Karten… danach gibt’s Futter.'}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pick(){cur=due()[0]||null;revealed=false;render()}function render(){mood();if(!cur){$('#study').innerHTML='<div class="done"><h2>Für heute fertig ✦</h2><p>Die Katze ist satt.</p></div>';$('#phase').textContent='Fertig';return}let x=pf(cur.id);$('#phase').textContent=x.state==='review'?'↻ Wiederholung':x.state==='relearning'?'↻ Wieder lernen':'✦ Neu lernen';$('#study').innerHTML='<div class="prompt">'+esc(cur.de)+'</div>'+(revealed?'<div class="ru">'+esc(cur.ru)+'</div><div class="note">'+esc(cur.note||'')+'</div><div class="ratings"><button class="btn again" data-r="again">Nochmal</button><button class="btn hard" data-r="hard">Schwer</button><button class="btn good" data-r="good">Gut</button><button class="btn easy" data-r="easy">Einfach</button></div>':'<button class="btn" id="show">Antwort zeigen</button>');if($('#show'))$('#show'].onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r))}function rate(r){let x=pf(cur.id);if(x.state!=='review'){if(r==='again'){x.correctStreak=0;x.due=Date.now()+MIN}else if(r==='hard'){x.correctStreak=0;x.due=Date.now()+6*MIN}else{x.correctStreak=(x.correctStreak||0)+1;if(x.correctStreak>=2){x.state='review';x.interval=1;x.due=Date.now()+DAY;x.correctStreak=0}else x.due=Date.now()+10*MIN}}else{let i=Math.max(1,x.interval||1);if(r==='again'){x.state='relearning';x.correctStreak=0;x.lapses=(x.lapses||0)+1;x.due=Date.now()+MIN}else if(r==='hard'){x.interval=Math.max(1,Math.round(i*1.2));x.due=Date.now()+x.interval*DAY}else if(r==='good'){x.interval=Math.max(i+1,Math.round(i*(x.ease||2.5)));x.due=Date.now()+x.interval*DAY}else{x.interval=Math.max(i+2,Math.round(i*(x.ease||2.5)*1.3));x.due=Date.now()+x.interval*DAY}}p[cur.id]=x;let d=new Date().toISOString().slice(0,10);if(meta.reviewDay!==d){meta.reviewDay=d;meta.reviewsToday=0}meta.reviewsToday=(meta.reviewsToday||0)+1;save();pick()}$('#tts').onclick=()=>{if(!cur||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(cur.ru);u.lang='ru-RU';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};$('#cat').src=H;pick()})()</script></body></html>
