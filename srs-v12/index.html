<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d22">
<title>Russian SRS</title>
<style>
:root{--bg:#090b1d;--panel:#151936;--line:#4b4693;--text:#f7f4ff;--muted:#aaa8cf;--lav:#8f7cf7;--pink:#e889bd;--gold:#e9bd6b;--green:#39b88e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -5%,#332269 0,#131536 32%,#090b1d 72%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.app{max-width:760px;margin:auto;padding:12px 12px 34px}.title{text-align:center;font-size:clamp(1.65rem,6vw,2.25rem);font-weight:900;margin:8px 0 14px;text-shadow:3px 3px 0 #382d7a;letter-spacing:.02em}.title small{display:block;font-size:.68rem;color:#c5bfff;letter-spacing:.16em;margin-top:4px}.panel{background:linear-gradient(180deg,#1a1e42,#10132c);border:2px solid var(--line);border-radius:16px;box-shadow:5px 6px 0 #050611}
.room{height:210px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#29264c 0 61%,#17152c 61%)}.room:before{content:"✦   ·   ✧      ·   ✦";position:absolute;top:18px;right:14px;color:#c6b9ff;opacity:.72;font-size:.86rem;letter-spacing:.28em}.room:after{content:"";position:absolute;left:0;right:0;bottom:0;height:39%;background:repeating-linear-gradient(90deg,#211b35 0 35px,#18142a 35px 39px);opacity:.78}.window{position:absolute;right:18px;top:34px;width:92px;height:72px;border:5px solid #4e467c;border-radius:7px;background:linear-gradient(#161a45,#25235a);box-shadow:0 0 0 3px #11132d,0 0 22px #8071df33}.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#4e467c}.window:after{content:"☾";position:absolute;right:13px;top:4px;color:#e9dcff;font-size:1.3rem}.rug{position:absolute;z-index:1;bottom:10px;width:270px;height:38px;border-radius:50%;background:#332650;box-shadow:inset 0 0 0 5px #443365,0 7px 0 #0a0b19}.cat{position:relative;z-index:3;width:min(60vw,265px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 7px 3px #05061188);margin-bottom:9px}.bowl{position:absolute;z-index:4;right:24px;bottom:23px;width:52px;height:22px;border-radius:4px 4px 18px 18px;background:#383567;border:4px solid #7167bd;box-shadow:0 5px 0 #090a18}.bowl:before{content:"";position:absolute;left:5px;right:5px;top:-5px;height:8px;border-radius:50%;background:#a96648;box-shadow:inset 0 0 0 2px #e2a56f}.bowl.empty:before{background:#17162d;box-shadow:inset 0 0 0 2px #302e58}.bowl:after{content:"✦";position:absolute;left:17px;top:3px;color:#b6aaf7;font-size:.68rem}.speech{position:absolute;z-index:5;left:12px;top:12px;max-width:160px;padding:10px 11px;border:2px solid #6b60b5;border-radius:10px;background:#0c1028ed;font-size:.72rem;line-height:1.35;box-shadow:3px 3px 0 #080817}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{text-align:center;padding:10px 6px;color:#c8c4e4}.stat b{display:block;color:#fff;font-size:1.22rem;margin-top:2px}.card{padding:18px;min-height:350px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.card:before{content:"✦";position:absolute;left:16px;bottom:14px;color:#514c94;opacity:.7}.prompt,.ru{text-align:center;font-weight:900}.prompt{font-size:clamp(1.75rem,7vw,2.75rem);margin:22px 0}.ru{font-size:clamp(1.5rem,6vw,2.2rem);color:#fff}.note{text-align:center;color:var(--muted);margin-top:10px;line-height:1.4}.btn{font:inherit;color:#fff;font-weight:900;border:2px solid var(--line);border-radius:11px;padding:13px;background:#37327d;width:100%;margin-top:12px;box-shadow:0 4px 0 #0a0b1c}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0a0b1c}.ratings{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:5px}.again{background:#a93d59}.hard{background:#8f632d}.good{background:#19735a}.easy{background:#266f88}.top{display:flex;justify-content:space-between;align-items:center;color:#c0badb}.phasepill{padding:6px 9px;border-radius:999px;background:#292759;border:1px solid #4d498d}.tts{width:auto;margin:0;padding:8px 12px}.done{text-align:center;color:var(--muted);padding:45px 10px}.progressHint{text-align:center;color:#8f8aaf;font-size:.74rem;margin-top:10px}.hearts{font-size:.8rem;color:#e88cbf;letter-spacing:.12em;margin-top:4px}
@media(max-width:480px){.room{height:190px}.cat{width:min(57vw,235px)}.window{width:75px;height:60px;right:12px}.bowl{right:15px;bottom:20px}.speech{max-width:145px;font-size:.67rem}.card{min-height:330px;padding:16px}.stats{gap:6px}.stat{font-size:.82rem}}
@media(min-width:700px){.ratings{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><main class="app">
<div class="title">✦ Russian SRS ✦<small>COZY REVIEW ROOM</small></div>
<div class="panel room"><div class="window"></div><div class="rug"></div><img id="cat" class="cat" src="./assets/cat-hungry-1.png?v=13" alt="Pixel-Art Katze"><div id="bowl" class="bowl empty"></div><div class="speech" id="speech">Noch ein paar Karten… danach gibt’s Futter.</div></div>
<div class="stats"><div class="panel stat">Offen<b id="open">0</b></div><div class="panel stat">Heute<b id="today">0</b></div><div class="panel stat">Katze<b id="mood">Hungrig</b><div class="hearts" id="hearts">♡ ♡ ♡</div></div></div>
<section class="panel card"><div class="top"><span id="phase" class="phasepill">✦ Neu lernen</span><button id="tts" class="btn tts">♪</button></div><div id="study"></div></section>
<div class="progressHint">Neue & vergessene Karten: 2× hintereinander richtig → morgen wieder.</div>
</main>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),K="russian-srs-progress-v1",M="russian-srs-meta-v1",L="russian-srs-local-cards-v1",DAY=86400000;
const base=[
{id:"a",de:"Ich hab keinen Bock zu kochen.",ru:"Мне влом готовить.",note:"влом = salopp: kein Bock"},
{id:"b",de:"Mir ist mulmig, da allein hinzugehen.",ru:"Мне стрёмно туда идти одной.",note:"стрёмно = mulmig / sketchy"},
{id:"c",de:"Ich hab auf der Arbeit Mist gebaut.",ru:"Я накосячила на работе.",note:"накосячить = Mist bauen"},
{id:"d",de:"Warum gehst du mir so auf den Sack?",ru:"Чё ты до меня докопался?",note:"докопаться = jemanden nerven"},
{id:"e",de:"Ich hab beschlossen, mir die Mühe zu machen und alles selbst zu machen.",ru:"Я решила заморочиться и сама всё сделать.",note:"заморочиться = sich richtig Mühe machen"},
{id:"f",de:"Ich kann darüber nicht mehr vor Lachen.",ru:"Я с этого угораю.",note:"угорать = sich kaputtlachen"},
{id:"g",de:"Hör auf, dich rauszureden.",ru:"Хватит отмазываться.",note:"отмазываться = sich rausreden"},
{id:"h",de:"Er ist mit seiner Lüge aufgeflogen.",ru:"Он спалился на лжи.",note:"спалиться = auffliegen"},
{id:"i",de:"Was willst du mir da erzählen?",ru:"Что ты мне втираешь?",note:"втирать = jemandem Quatsch erzählen"},
{id:"j",de:"Ich bin nach Hause gekommen und direkt weggepennt.",ru:"Я пришла домой и сразу вырубилась.",note:"вырубиться = wegpennen"}
];
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
let p=load(K,{}),meta=load(M,{totalReviews:0,reviewsToday:0,reviewDay:""}),local=load(L,[]),cards=[...base,...local],cur=null,revealed=false,catFrame=0,catMood="hungry";
const fresh=()=>({state:"learning",correctStreak:0,due:0,interval:0,ease:2.5,reviews:0,lapses:0});
function pf(id){let x=p[id];if(!x)return fresh();if(x.state)return x;return{state:(x.reps||0)>0?"review":"learning",correctStreak:0,due:x.due||0,interval:Math.max(1,Math.round(x.interval||1)),ease:x.ease||2.5,reviews:x.reps||0,lapses:x.lapses||0}}
function save(){localStorage.setItem(K,JSON.stringify(p));localStorage.setItem(M,JSON.stringify(meta));localStorage.setItem(L,JSON.stringify(local))}
function endToday(){let d=new Date();d.setHours(23,59,59,999);return d.getTime()}
function due(){return cards.filter(c=>pf(c.id).due<=Date.now()).sort((a,b)=>pf(a.id).due-pf(b.id).due)}
function openToday(){return cards.filter(c=>pf(c.id).due<=endToday()).length}
function drawCat(){const pre=catMood==="happy"?"happy":"hungry";$("#cat").src=`./assets/cat-${pre}-${catFrame+1}.png?v=13`}
function setCat(m){if(catMood===m)return;catMood=m;catFrame=0;drawCat()}
setInterval(()=>{catFrame=1-catFrame;drawCat()},720);
function stats(){const o=openToday();$("#open").textContent=o;$("#today").textContent=meta.reviewsToday||0;if(o===0){setCat("happy");$("#mood").textContent="Satt";$("#speech").textContent="Mrrr… alles geschafft. ♡";$("#bowl").classList.remove("empty");$("#hearts").textContent="♥ ♥ ♥"}else{setCat("hungry");$("#mood").textContent="Hungrig";$("#speech").textContent=`Noch ${o} Karten… danach gibt’s Futter.`;$("#bowl").classList.add("empty");$("#hearts").textContent=o<=3?"♥ ♥ ♡":o<=7?"♥ ♡ ♡":"♡ ♡ ♡"}}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function pick(){cur=due()[0]||null;revealed=false;render()}
function render(){stats();if(!cur){$("#phase").textContent=openToday()?"✧ Noch heute":"✦ Fertig";$("#study").innerHTML='<div class="done"><h2>'+(openToday()?"Keine Karte gerade fällig.":"Für heute fertig ✦")+'</h2></div>';return}
const x=pf(cur.id);$("#phase").textContent=x.state==="review"?"↻ Wiederholung":x.state==="relearning"?`↻ Wieder lernen ${Math.min(2,x.correctStreak||0)}/2`:`✦ Neu lernen ${Math.min(2,x.correctStreak||0)}/2`;
$("#study").innerHTML=`<div class="prompt">${esc(cur.de)}</div><div class="ru" style="display:${revealed?"block":"none"}">${esc(cur.ru)}</div>${revealed&&cur.note?`<div class="note">${esc(cur.note)}</div>`:""}${revealed?'<div class="ratings"><button class="btn again" data-r="again">Nochmal</button><button class="btn hard" data-r="hard">Schwer</button><button class="btn good" data-r="good">Gut</button><button class="btn easy" data-r="easy">Einfach</button></div>':'<button class="btn" id="show">Antwort zeigen</button>'}`;
if($("#show"))$("#show").onclick=()=>{revealed=true;render()};document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(b.dataset.r))}
function rate(r){let x=pf(cur.id);if(x.state!=="review"){
if(r==="again"||r==="hard"){x.correctStreak=0;x.due=0}
else{x.correctStreak=(x.correctStreak||0)+1;if(x.correctStreak>=2){x.state="review";x.interval=1;x.due=Date.now()+DAY;x.correctStreak=0}else{x.due=0}}
}else{let i=Math.max(1,x.interval||1);if(r==="again"){x.state="relearning";x.correctStreak=0;x.lapses=(x.lapses||0)+1;x.ease=Math.max(1.3,(x.ease||2.5)-.2);x.due=0}else if(r==="hard"){x.interval=Math.max(1,Math.round(i*1.2));x.due=Date.now()+x.interval*DAY}else if(r==="good"){x.interval=Math.max(i+1,Math.round(i*(x.ease||2.5)));x.due=Date.now()+x.interval*DAY}else{x.interval=Math.max(i+2,Math.round(i*(x.ease||2.5)*1.3));x.due=Date.now()+x.interval*DAY}}
p[cur.id]=x;const d=new Date().toISOString().slice(0,10);if(meta.reviewDay!==d){meta.reviewDay=d;meta.reviewsToday=0}meta.reviewsToday=(meta.reviewsToday||0)+1;meta.totalReviews=(meta.totalReviews||0)+1;save();pick()}
$("#tts").onclick=()=>{if(!cur||!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(cur.ru);u.lang="ru-RU";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};
pick();setInterval(()=>{if(!cur&&due().length)pick();else stats()},15000);
})();
</script></body></html>
