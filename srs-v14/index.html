<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d22"><title>Russian SRS</title><style>:root{--line:#4b4693;--text:#f7f4ff;--muted:#aaa8cf;--red:#b6405a;--amber:#9d6d2c;--green:#1b7d61;--blue:#2b7188}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -5%,#332269 0,#131536 32%,#090b1d 72%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.app{max-width:760px;margin:auto;padding:12px 12px 34px}.title{text-align:center;font-size:clamp(1.65rem,6vw,2.25rem);font-weight:900;margin:8px 0 14px;text-shadow:3px 3px 0 #382d7a}.title small{display:block;font-size:.68rem;color:#c5bfff;letter-spacing:.16em;margin-top:4px}.panel{background:linear-gradient(180deg,#1a1e42,#10132c);border:2px solid var(--line);border-radius:16px;box-shadow:5px 6px 0 #050611}.room{height:185px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#29264c 0 61%,#17152c 61%)}.room:before{content:"✦   ·   ✧      ·   ✦";position:absolute;top:15px;right:13px;color:#c6b9ff;opacity:.7;font-size:.78rem;letter-spacing:.22em}.room:after{content:"";position:absolute;left:0;right:0;bottom:0;height:39%;background:repeating-linear-gradient(90deg,#211b35 0 35px,#18142a 35px 39px);opacity:.78}.window{position:absolute;right:16px;top:31px;width:78px;height:62px;border:5px solid #4e467c;border-radius:7px;background:linear-gradient(#161a45,#25235a);box-shadow:0 0 0 3px #11132d,0 0 22px #8071df33}.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#4e467c}.window:after{content:"☾";position:absolute;right:11px;top:2px;color:#e9dcff;font-size:1.15rem}.rug{position:absolute;z-index:1;bottom:10px;width:185px;height:26px;border-radius:50%;background:#332650;box-shadow:inset 0 0 0 4px #443365,0 6px 0 #0a0b19}.cat{position:relative;z-index:3;width:min(30vw,135px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 6px 3px #05061188);margin-bottom:11px}.bowl{position:absolute;z-index:4;right:26px;bottom:22px;width:46px;height:19px;border-radius:4px 4px 16px 16px;background:#383567;border:4px solid #7167bd;box-shadow:0 4px 0 #090a18}.bowl:before{content:"";position:absolute;left:4px;right:4px;top:-5px;height:7px;border-radius:50%;background:#17162d;box-shadow:inset 0 0 0 2px #302e58}.bowl.full:before{background:#a96648;box-shadow:inset 0 0 0 2px #e2a56f}.bowl:after{content:"✦";position:absolute;left:14px;top:2px;color:#b6aaf7;font-size:.63rem}.speech{position:absolute;z-index:5;left:12px;top:12px;max-width:150px;padding:9px 10px;border:2px solid #6b60b5;border-radius:10px;background:#0c1028ed;font-size:.69rem;line-height:1.35;box-shadow:3px 3px 0 #080817}.catStatus{margin:10px 0;padding:12px 14px;text-align:center}.catStatus span{color:var(--muted)}.catStatus b{display:block;font-size:1.28rem;margin-top:3px}.hearts{color:#e88cbf;letter-spacing:.12em;font-size:.85rem;margin-top:4px}.card{padding:18px;min-height:350px;display:flex;flex-direction:column;justify-content:center}.prompt,.ru{text-align:center;font-weight:900}.prompt{font-size:clamp(1.75rem,7vw,2.75rem);margin:22px 0}.ru{font-size:clamp(1.5rem,6vw,2.2rem)}.note{text-align:center;color:var(--muted);margin-top:10px}.btn{font:inherit;color:#fff;font-weight:900;border:2px solid var(--line);border-radius:11px;padding:13px;background:#37327d;width:100%;margin-top:12px;box-shadow:0 4px 0 #0a0b1c}.ratings{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.again{background:var(--red)}.hard{background:var(--amber)}.good{background:var(--green)}.easy{background:var(--blue)}.ratings small{display:block;font-size:.65rem;opacity:.76;margin-top:3px}.top{display:flex;justify-content:space-between;align-items:center;color:#c0badb}.phasepill{padding:6px 9px;border-radius:999px;background:#292759;border:1px solid #4d498d}.tts{width:auto;margin:0;padding:8px 12px}.done{text-align:center;color:var(--muted);padding:45px 10px}.hint{text-align:center;color:#8f8aaf;font-size:.72rem;margin-top:10px}@media(max-width:480px){.room{height:170px}.cat{width:min(29vw,125px)}.window{width:70px;height:56px;right:12px}.bowl{right:14px;bottom:20px}.speech{max-width:140px;font-size:.65rem}.card{min-height:330px;padding:16px}}@media(min-width:700px){.ratings{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="app"><div class="title">✦ Russian SRS ✦<small>COZY REVIEW ROOM</small></div><div class="panel room"><div class="window"></div><div class="rug"></div><img id="cat" class="cat" src="../srs-v12/assets/cat-hungry-1.png?v=15"><div id="bowl" class="bowl"></div><div class="speech" id="speech">Ich warte auf meine Reviews…</div></div><div class="panel catStatus"><span>Katzenstatus</span><b id="mood">Hungrig</b><div class="hearts" id="hearts">♡ ♡ ♡</div></div><section class="panel card"><div class="top"><span id="phase" class="phasepill">✦ Lernen</span><button id="tts" class="btn tts">♪</button></div><div id="study"></div></section><div class="hint">Nochmal/Lernschritt → ungefähr 5 andere Karten Abstand.</div></main><script>(()=>{'use strict';const $=s=>document.querySelector(s),K='russian-srs-progress-v1',M='russian-srs-meta-v1',L='russian-srs-local-cards-v1',DAY=86400000;const base=[{id:'a',de:'Ich hab keinen Bock zu kochen.',ru:'Мне влом готовить.',note:'влом = salopp: kein Bock'},{id:'b',de:'Mir ist mulmig, da allein hinzugehen.',ru:'Мне стрёмно туда идти одной.',note:'стрёмно = mulmig / sketchy'},{id:'c',de:'Ich hab auf der Arbeit Mist gebaut.',ru:'Я накосячила на работе.',note:'накосячить = Mist bauen'},{id:'d',de:'Warum gehst du mir so auf den Sack?',ru:'Чё ты до меня докопался?',note:'докопаться = jemanden nerven'},{id:'e',de:'Ich hab beschlossen, mir die Mühe zu machen und alles selbst zu machen.',ru:'Я решила заморочиться и сама всё сделать.',note:'заморочиться = sich richtig Mühe machen'},{id:'f',de:'Ich kann darüber nicht mehr vor Lachen.',ru:'Я с этого угораю.',note:'угорать = sich kaputtlachen'},{id:'g',de:'Hör auf, dich rauszureden.',ru:'Хватит отмазываться.',note:'отмазываться = sich rausreden'},{id:'h',de:'Er ist mit seiner Lüge aufgeflogen.',ru:'Он спалился на лжи.',note:'спалиться = auffliegen'},{id:'i',de:'Was willst du mir da erzählen?',ru:'Что ты мне втираешь?',note:'втирать = jemandem Quatsch erzählen'},{id:'j',de:'Ich bin nach Hause gekommen und direkt weggepennt.',ru:'Я пришла домой und сразу вырубилась.',note:'вырубиться = wegpennen'}];const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};let p=load(K,{}),meta=load(M,{totalReviews:0,reviewsToday:0,reviewDay:''}),local=load(L,[]),cards=[...base,...local],cur=null,revealed=false,catFrame=0,catMood='hungry';const fresh=()=>({state:'learning',correctStreak:0,due:0,interval:0,ease:2.5,reviews:0,lapses:0});function pf(id){let x=p[id];return x&&x.state?x:x?{state:(x.reps||0)>0?'review':'learning',correctStreak:0,due:x.due||0,interval:Math.max(1,Math.round(x.interval||1)),ease:x.ease||2.5,reviews:x.reps||0,lapses:x.lapses||0}:fresh()}function save(){localStorage.setItem(K,JSON.stringify(p));localStorage.setItem(M,JSON.stringify(meta));localStorage.setItem(L,JSON.stringify(local))}const byId=id=>cards.find(c=>c.id===id);let queue=cards.filter(c=>pf(c.id).due<=Date.now()).map(c=>c.id);function insertLater(id,gap=5){queue=queue.filter(x=>x!==id);queue.splice(Math.min(gap,queue.length),0,id)}function drawCat(){const pre=catMood==='happy'?'happy':'hungry';$('#cat').src=`../srs-v12/assets/cat-${pre}-${catFrame+1}.png?v=15`}function setCat(m){if(catMood===m)return;catMood=m;catFrame=0;drawCat()}setInterval(()=>{catFrame=1-catFrame;drawCat()},760);function catStats(){if(queue.length===0){setCat('happy');$('#mood').textContent='Satt';$('#speech').textContent='Mrrr… alle Reviews geschafft. ♡';$('#bowl').classList.add('full');$('#hearts').textContent='♥ ♥ ♥'}else{setCat('hungry');$('#mood').textContent='Hungrig';$('#speech').textContent=`Noch ${queue.length} Karten in der Runde.`;$('#bowl').classList.remove('full');$('#hearts').textContent=queue.length<=3?'♥ ♥ ♡':queue.length<=7?'♥ ♡ ♡':'♡ ♡ ♡'}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(n){return n===1?'1 Tag':n+' Tage'}function labels(x){if(x.state!=='review')return{again:'≈ 5 Karten',hard:'≈ 5 Karten',good:'≈ 5 Karten',easy:'1 Tag'};let i=Math.max(1,x.interval||1),e=x.ease||2.5;return{again:'≈ 5 Karten',hard:fmt(Math.max(1,Math.round(i*1.2))),good:fmt(Math.max(i+1,Math.round(i*e))),easy:fmt(Math.max(i+2,Math.round(i*e*1.3)))}}function pick(){const id=queue.shift();cur=id?byId(id):null;revealed=false;render()}function render(){catStats();if(!cur){$('#phase').textContent='✦ Fertig';$('#study').innerHTML='<div class="done"><h2>Für heute fertig ✦</h2></div>';return}const x=pf(cur.id),lab=labels(x);$('#phase').textContent=x.state==='review'?'↻ Review':x.state==='relearning'?`↻ Wieder lernen ${Math.min(2,x.correctStreak||0)}/2`:`✦ Neu lernen ${Math.min(2,x.correctStreak||0)}/2`;$('#study').innerHTML=`<div class="prompt">${esc(cur.de)}</div><div class="ru" style="display:${revealed?'block':'none'}">${esc(cur.ru)}</div>${revealed&&cur.note?`<div class="note">${esc(cur.note)}</div>`:''}${revealed?`<div class="ratings"><button class="btn again" data-r="again">Nochmal<small>${lab.again}</small></button><button class="btn hard" data-r="hard">Schwer<small>${lab.hard}</small></button><button class="btn good" data-r="good">Gut<small>${lab.good}</small></button><button class="btn easy" data-r="easy">Einfach<small>${lab.easy}</small></button></div>`:'<button class="btn" id="show">Antwort zeigen</button>'}`;if($('#show'))$('#show').onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r))}function rate(r){let x=pf(cur.id),id=cur.id;if(x.state!=='review'){if(r==='again'){x.correctStreak=0;x.due=0;insertLater(id,5)}else if(r==='hard'){x.correctStreak=0;x.due=0;insertLater(id,5)}else if(r==='easy'){x.correctStreak=0;x.state='review';x.interval=1;x.due=Date.now()+DAY}else{x.correctStreak=(x.correctStreak||0)+1;if(x.correctStreak>=2){x.state='review';x.interval=2;x.due=Date.now()+2*DAY;x.correctStreak=0}else{x.due=0;insertLater(id,5)}}}else{let i=Math.max(1,x.interval||1);if(r==='again'){x.state='relearning';x.correctStreak=0;x.lapses=(x.lapses||0)+1;x.ease=Math.max(1.3,(x.ease||2.5)-.2);x.due=0;insertLater(id,5)}else if(r==='hard'){x.interval=Math.max(1,Math.round(i*1.2));x.ease=Math.max(1.3,(x.ease||2.5)-.05);x.due=Date.now()+x.interval*DAY}else if(r==='good'){x.interval=Math.max(i+1,Math.round(i*(x.ease||2.5)));x.due=Date.now()+x.interval*DAY}else{x.interval=Math.max(i+2,Math.round(i*(x.ease||2.5)*1.3));x.ease=Math.min(3,(x.ease||2.5)+.05);x.due=Date.now()+x.interval*DAY}}x.reviews=(x.reviews||0)+1;p[id]=x;const d=new Date().toISOString().slice(0,10);if(meta.reviewDay!==d){meta.reviewDay=d;meta.reviewsToday=0}meta.reviewsToday=(meta.reviewsToday||0)+1;meta.totalReviews=(meta.totalReviews||0)+1;save();pick()}$('#tts').onclick=()=>{if(!cur||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(cur.ru);u.lang='ru-RU';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};pick()})();</script></body></html>
