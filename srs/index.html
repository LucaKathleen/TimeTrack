<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b22"><title>Russian SRS</title><style>:root{--bg:#090b22;--panel:#0f1330;--panel2:#151a3b;--line:#4b4ca3;--text:#f2f1ff;--muted:#b0aed8;--violet:#7a64ff;--red:#f25d76;--orange:#e99b3e;--green:#24bb89;--cyan:#2eb9cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b1946,#0c1028 42%,#080a18 100%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.app{max-width:1500px;margin:auto;padding:18px}.top{display:grid;grid-template-columns:260px 1fr 210px;align-items:center;gap:20px;margin-bottom:14px}.brand{text-align:center;font-size:clamp(1.7rem,3vw,2.7rem);font-weight:900;letter-spacing:.04em;text-shadow:4px 4px 0 #32266d}.clock{justify-self:end;border:2px solid var(--line);border-radius:12px;padding:10px 16px;background:#111534;box-shadow:4px 4px 0 #050611}.clock b{display:block;font-size:1.35rem}.tabs{grid-column:2/3;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tab{border:2px solid #31356d;background:#111530;color:#c9c7ef;padding:13px 10px;border-radius:8px;font:inherit}.tab.active{background:#5143a8;border-color:#836eff;color:white}.dashboard{display:grid;grid-template-columns:260px minmax(560px,1fr) 250px;gap:16px}.panel{background:linear-gradient(180deg,rgba(17,21,52,.97),rgba(11,14,34,.97));border:2px solid #3e418d;border-radius:10px;box-shadow:5px 5px 0 #050612}.today{padding:16px;align-self:start}.today h3{margin:0 0 12px}.progress{height:12px;border:2px solid #30356d;border-radius:99px;background:#10142d;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#9ca2ff;width:0}.count{display:flex;justify-content:space-between;padding:7px 0;color:#c7c5eb}.count i{width:11px;height:11px;display:inline-block;margin-right:8px}.d1{background:#795eff}.d2{background:#ef9e46}.d3{background:#34c7b4}.leftScene{margin-top:15px;height:460px;background:url('./cat-room.svg?v=1') center/cover no-repeat;border:2px solid #413f8a;border-radius:10px;position:relative;overflow:hidden}.speech{position:absolute;left:20px;top:46px;width:210px;padding:17px;background:#0e1129;border:3px solid #d9d8ff;border-radius:18px;color:white;line-height:1.45;box-shadow:4px 4px 0 #050611}.speech:after{content:'';position:absolute;bottom:-18px;left:86px;border:10px solid transparent;border-top-color:#d9d8ff}.maincol{min-width:0}.studyWrap{padding:18px}.card{min-height:455px;padding:24px;position:relative;display:flex;flex-direction:column;justify-content:center}.badge{position:absolute;top:14px;left:16px;padding:7px 12px;background:#2c2a67;border-radius:18px;color:#c5bcff;font-size:.8rem}.tts{position:absolute;top:14px;right:16px;width:46px;height:46px;border:2px solid #5f58bc;background:#222654;color:white;border-radius:8px}.prompt{text-align:center;font-size:clamp(2rem,4vw,3.2rem);font-weight:900;margin:40px 0 22px}.answer{display:none;text-align:center;border-top:2px solid #3a3e70;padding-top:22px}.answer.show{display:block}.ru{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:900}.note{margin-top:14px;color:#c0bddf}.actions{margin-top:14px}.btn{width:100%;padding:15px 16px;border-radius:9px;border:2px solid #454890;background:#171b3c;color:white;font:inherit;font-weight:800;box-shadow:3px 3px 0 #050611}.primary{background:#5143a8}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.ratings .btn{font-size:1rem}.ratings small{display:block;margin-top:6px;opacity:.75}.again{background:#9e3a50;border-color:#ed6078}.hard{background:#9c5e20;border-color:#eca64d}.good{background:#137c5f;border-color:#2dcea0}.easy{background:#166f82;border-color:#33c9df}.bottom{display:grid;grid-template-columns:1fr 1.35fr;gap:16px;margin-top:16px}.statusPanel,.learned{padding:18px;min-height:165px}.statusPanel h3,.learned h3{margin:0 0 12px}.statusTitle{font-size:1.5rem;font-weight:900;color:#ff7188}.hungerbar{height:15px;border:2px solid #3d4388;border-radius:99px;background:#151936;overflow:hidden;margin:12px 0}.hungerbar div{height:100%;background:linear-gradient(90deg,#ff617b,#ff7890);width:100%}.bowls{display:flex;justify-content:space-between;color:#9c7c79;font-size:1.5rem}.learnedCount{font-size:1.7rem}.miniBars{height:65px;display:flex;align-items:end;gap:8px;margin-top:12px;border-bottom:2px solid #55598e}.miniBars i{width:12px;background:#8062ff;display:block}.rightcol{display:grid;gap:14px;align-content:start}.rightbox{padding:18px;text-align:center}.rightbox h3{margin:0 0 13px}.next{font-size:1.45rem;color:#a786ff}.streakNum{font-size:2.3rem;font-weight:900}.week{display:flex;justify-content:space-between;margin-top:14px;color:#aaa9ce;font-size:.75rem}.dots{display:flex;justify-content:space-between;margin-top:7px}.dots i{width:14px;height:14px;border-radius:50%;background:#795eff}.dots i.off{background:#1a2046;border:1px solid #343a75}.quote{font-size:1.1rem;line-height:1.5;color:#a99cff;text-align:left}.addBig{margin-top:80px;width:100%;padding:22px;background:#32256f;border:2px solid #6657c4;color:white;border-radius:10px;font:inherit;font-size:1.15rem;font-weight:900;box-shadow:5px 5px 0 #050611}.modal{position:fixed;inset:0;background:#050611dd;display:grid;place-items:center;padding:20px;z-index:50}.modal[hidden]{display:none}.modalCard{width:min(520px,100%);padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:40px;height:40px;background:#171b3c;color:white;border:2px solid #454890}.modal label{display:block;margin-top:12px;color:#b8b6dd}.modal input,.modal textarea{width:100%;margin-top:6px;background:#0b0e23;color:white;border:2px solid #424687;padding:12px;font:inherit}.msg{text-align:center;color:#bbb9de;margin-top:10px}.empty{text-align:center;color:#b5b3d5;padding:60px 10px}@media(max-width:1050px){.app{padding:10px}.top{grid-template-columns:1fr}.tabs{grid-column:1}.clock{display:none}.dashboard{grid-template-columns:1fr}.today{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.today h3,.progress{grid-column:1/-1}.leftScene{height:320px}.rightcol{grid-template-columns:repeat(3,1fr)}.addBig{margin-top:0;grid-column:1/-1}.bottom{grid-template-columns:1fr 1fr}}@media(max-width:650px){.tabs{grid-template-columns:repeat(2,1fr)}.today{grid-template-columns:repeat(3,1fr)}.leftScene{height:270px}.speech{width:165px;font-size:.8rem;left:12px;top:26px}.studyWrap{padding:10px}.card{min-height:360px;padding:16px}.ratings{grid-template-columns:repeat(2,1fr)}.bottom,.rightcol{grid-template-columns:1fr}.rightbox:nth-child(2),.rightbox:nth-child(3){display:none}.addBig{padding:17px}.brand{font-size:1.6rem}}</style></head><body><main class="app"><header class="top"><div></div><div class="brand">✦ Russian SRS ✦</div><div class="clock"><b id="clock">23:29</b><span id="date">Mi, 3. Sep.</span></div><nav class="tabs"><button class="tab active">Lernen <span id="tabDue">0</span></button><button class="tab">Übersicht</button><button class="tab">Karten</button><button class="tab">Statistiken</button></nav></header><section class="dashboard"><aside><div class="panel today"><h3>▣ Heute</h3><div class="progress"><div id="todayProgress"></div></div><div class="count"><span><i class="d1"></i>Neu</span><b id="newCount">0</b></div><div class="count"><span><i class="d2"></i>Lernen</span><b id="learnCount">0</b></div><div class="count"><span><i class="d3"></i>Wiederholen</span><b id="reviewCount">0</b></div></div><div class="leftScene"><div class="speech" id="speech">Noch ein paar Karten…<br>danach gibt's Futter. ♥</div></div></aside><section class="maincol"><div class="panel studyWrap"><div id="study"></div></div><div class="bottom"><div class="panel statusPanel"><h3>🐾 Katzenstatus</h3><div class="statusTitle" id="catStatus">Hungrig</div><div class="hungerbar"><div id="hungerFill"></div></div><div class="bowls"><span>▰</span><span>▰</span><span>▰</span><span>▰</span></div></div><div class="panel learned"><h3>▣ Heute gelernt</h3><div class="learnedCount"><b id="reviewsToday">0</b> Karten</div><div class="miniBars"><i style="height:18%"></i><i style="height:62%"></i><i style="height:28%"></i><i style="height:74%"></i><i style="height:42%"></i><i style="height:88%"></i><i style="height:56%"></i><i style="height:38%"></i><i style="height:64%"></i><i style="height:44%"></i></div></div></div></section><aside class="rightcol"><div class="panel rightbox"><h3>◷ Nächste Karte</h3><div class="next" id="nextDueText">jetzt</div></div><div class="panel rightbox"><h3>🔥 Streak</h3><div class="streakNum"><span id="streak">0</span> <small>Tage</small></div><div class="week"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div class="dots"><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div></div><div class="panel rightbox quote">❝<br>Маленькие шаги<br>каждый день. ♥</div><button class="addBig" id="openAdd">＋ Karte hinzufügen</button></aside></section></main><div class="modal" id="modal" hidden><div class="panel modalCard"><div class="modalHead"><strong>＋ Neue Karte</strong><button class="close" id="closeAdd">×</button></div><label>Deutsch<input id="newDe"></label><label>Russisch<textarea id="newRu" rows="3"></textarea></label><label>Notiz (optional)<input id="newNote"></label><button class="btn primary" id="saveCard" style="margin-top:14px">Karte hinzufügen</button><div class="msg" id="msg"></div></div></div><script>(()=>{const $=s=>document.querySelector(s),KEY='russian-srs-progress-v1',META='russian-srs-meta-v1',LOCAL='russian-srs-local-cards-v1',MIN=60000,DAY=86400000;const base=[{id:'vplom-gotovit',de:'Ich hab keinen Bock zu kochen.',ru:'Мне влом готовить.',note:'влом = salopp: zu lästig / kein Bock'},{id:'stremno-idti',de:'Mir ist etwas mulmig dabei, da allein hinzugehen.',ru:'Мне стрёмно туда идти одной.',note:'стрёмно = sketchy, unangenehm, mulmig'},{id:'nakosyachit-rabota',de:'Ich hab auf der Arbeit Mist gebaut.',ru:'Я накосячила на работе.',note:'накосячить = Mist bauen / verkacken'},{id:'dokopalsya',de:'Warum gehst du mir so auf den Sack?',ru:'Чё ты до меня докопался?',note:'докопаться = sich an jemandem festbeißen / nerven'},{id:'zamorochitsya',de:'Ich hab beschlossen, mir die Mühe zu machen und alles selbst zu machen.',ru:'Я решила заморочиться и сама всё сделать.',note:'заморочиться = sich richtig Mühe machen'},{id:'ugorayu',de:'Ich kann darüber nicht mehr vor Lachen.',ru:'Я с этого угораю.',note:'угорать = sich kaputtlachen'},{id:'otmazyvatsya',de:'Hör auf, dich rauszureden.',ru:'Хватит отмазываться.',note:'отмазываться = sich rausreden'},{id:'spalitsya',de:'Er ist mit seiner Lüge aufgeflogen.',ru:'Он спалился на лжи.',note:'спалиться = auffliegen'},{id:'vtirat',de:'Was willst du mir da erzählen?',ru:'Что ты мне втираешь?',note:'втирать = jemandem Quatsch erzählen'},{id:'vyrubitsya',de:'Ich bin nach Hause gekommen und direkt weggepennt.',ru:'Я пришла домой и сразу вырубилась.',note:'вырубиться = wegpennen'}];const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};let progress=load(KEY,{}),meta=load(META,{totalReviews:0,streak:0,lastStudy:null,reviewsToday:0,reviewsDay:null}),locals=load(LOCAL,[]),cards=[...base,...locals],current=null,revealed=false;function fresh(){return{state:'learning',correctStreak:0,due:0,interval:0,ease:2.5,reviews:0,lapses:0}}function pFor(id){const o=progress[id];if(!o)return fresh();if(o.state)return o;return{state:(o.reps||0)>0?'review':'learning',correctStreak:0,due:o.due||0,interval:Math.max(1,Math.round(o.interval||1)),ease:o.ease||2.5,reviews:o.reps||0,lapses:o.lapses||0}}function save(){localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem(META,JSON.stringify(meta));localStorage.setItem(LOCAL,JSON.stringify(locals))}function todayKey(){return new Date().toISOString().slice(0,10)}function touchDay(){const t=todayKey();if(meta.lastStudy!==t){const y=new Date();y.setDate(y.getDate()-1);const yd=y.toISOString().slice(0,10);meta.streak=meta.lastStudy===yd?(meta.streak||0)+1:1;meta.lastStudy=t}if(meta.reviewsDay!==t){meta.reviewsDay=t;meta.reviewsToday=0}}function endToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime()}function dueNow(){return cards.filter(c=>pFor(c.id).due<=Date.now()).sort((a,b)=>pFor(a.id).due-pFor(b.id).due)}function openToday(){return cards.filter(c=>pFor(c.id).due<=endToday())}function nextDue(){return cards.map(c=>pFor(c.id).due).filter(x=>x>Date.now()).sort((a,b)=>a-b)[0]||null}function fmt(ms){if(ms<=90000)return'in 1 Min';if(ms<60*MIN)return'in '+Math.max(1,Math.round(ms/MIN))+' Min';if(ms<DAY)return'in '+Math.max(1,Math.round(ms/(60*MIN)))+' Std';const d=Math.max(1,Math.round(ms/DAY));return'in '+d+' Tag'+(d===1?'':'en')}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function counts(){let n=0,l=0,r=0;openToday().forEach(c=>{const p=pFor(c.id);if(p.state==='review')r++;else if((p.reviews||0)===0)n++;else l++});return{n,l,r}}function updateUI(){const due=dueNow().length,open=openToday().length,c=counts();$('#tabDue').textContent=due;$('#newCount').textContent=c.n;$('#learnCount').textContent=c.l;$('#reviewCount').textContent=c.r;$('#reviewsToday').textContent=meta.reviewsToday||0;$('#streak').textContent=meta.streak||0;$('#todayProgress').style.width=((cards.length-open)/Math.max(1,cards.length)*100)+'%';$('#hungerFill').style.width=Math.min(100,open/Math.max(1,cards.length)*100)+'%';const nd=nextDue();$('#nextDueText').textContent=due?'jetzt':nd?fmt(nd-Date.now()):'morgen';if(open===0){$('#catStatus').textContent='Zufrieden';$('#catStatus').style.color='#4fd6a3';$('#speech').innerHTML='Mrrrp… satt. ♥<br>Morgen wieder.'}else{$('#catStatus').textContent=due?'Hungrig':'Wartet';$('#catStatus').style.color=due?'#ff7188':'#e7b258';$('#speech').innerHTML=due?`Noch ${open} Karte${open===1?'':'n'}…<br>danach gibt's Futter. ♥`:`Kurz warten…<br>gleich geht's weiter.`}}function intervals(p){if(p.state==='learning'||p.state==='relearning')return p.correctStreak===0?{again:'1 Min',hard:'6 Min',good:'10 Min',easy:'10 Min'}:{again:'1 Min',hard:'1 Tag',good:'1 Tag',easy:'1 Tag'};const i=Math.max(1,p.interval||1),e=Math.max(1.3,p.ease||2.5);return{again:'1 Min',hard:Math.max(1,Math.round(i*1.2))+' Tage',good:Math.max(i+1,Math.round(i*e))+' Tage',easy:Math.max(i+2,Math.round(i*e*1.3))+' Tage'}}function pick(){current=dueNow()[0]||null;revealed=false;render()}function render(){updateUI();if(!current){const nd=nextDue(),open=openToday().length;$('#study').innerHTML=`<div class="empty"><h2>${open?'Kurz warten…':'Für heute fertig ✦'}</h2><p>${open&&nd?'Die nächste Karte kommt '+fmt(nd-Date.now())+'.':'Deine Katze ist satt. Morgen geht es weiter.'}</p>${open?'<button class="btn" id="refresh">Jetzt prüfen</button>':'<button class="btn primary" id="random">Zufällig üben</button>'}</div>`;if($('#refresh'))$('#refresh').onclick=pick;if($('#random'))$('#random').onclick=()=>{current=cards[Math.floor(Math.random()*cards.length)];render()};return}const p=pFor(current.id),iv=intervals(p),phase=p.state==='review'?'↻ Wiederholung':p.state==='relearning'?'↻ Wieder lernen':'✦ Neu lernen';$('#study').innerHTML=`<div class="card panel"><div class="badge">${phase}</div><button class="tts" id="tts">♪</button><div class="prompt">${esc(current.de)}</div><div class="answer ${revealed?'show':''}"><div class="ru">${esc(current.ru)}</div>${current.note?`<div class="note">${esc(current.note)}</div>`:''}</div></div><div class="actions">${revealed?`<div class="ratings"><button class="btn again" data-r="again">Nochmal<small>${iv.again}</small></button><button class="btn hard" data-r="hard">Schwer<small>${iv.hard}</small></button><button class="btn good" data-r="good">Gut<small>${iv.good}</small></button><button class="btn easy" data-r="easy">Einfach<small>${iv.easy}</small></button></div>`:'<button class="btn primary" id="reveal">Antwort zeigen</button>'}</div>`;$('#tts').onclick=speak;if($('#reveal'))$('#reveal').onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r))}function rate(r){touchDay();let p=pFor(current.id);if(p.state==='learning'||p.state==='relearning'){if(r==='again'){p.correctStreak=0;p.due=Date.now()+MIN}else if(r==='hard'){p.correctStreak=0;p.due=Date.now()+6*MIN}else{p.correctStreak=(p.correctStreak||0)+1;if(p.correctStreak>=2){p.state='review';p.interval=1;p.due=Date.now()+DAY;p.correctStreak=0}else p.due=Date.now()+10*MIN}}else{const i=Math.max(1,p.interval||1);if(r==='again'){p.state='relearning';p.correctStreak=0;p.lapses=(p.lapses||0)+1;p.ease=Math.max(1.3,(p.ease||2.5)-.2);p.due=Date.now()+MIN}else if(r==='hard'){p.interval=Math.max(1,Math.round(i*1.2));p.ease=Math.max(1.3,(p.ease||2.5)-.1);p.due=Date.now()+p.interval*DAY}else if(r==='good'){p.interval=Math.max(i+1,Math.round(i*(p.ease||2.5)));p.due=Date.now()+p.interval*DAY}else{p.ease=(p.ease||2.5)+.08;p.interval=Math.max(i+2,Math.round(i*p.ease*1.3));p.due=Date.now()+p.interval*DAY}}p.reviews=(p.reviews||0)+1;progress[current.id]=p;meta.totalReviews=(meta.totalReviews||0)+1;meta.reviewsToday=(meta.reviewsToday||0)+1;save();pick()}function speak(){if(!current||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.ru);u.lang='ru-RU';u.rate=.9;const vs=speechSynthesis.getVoices().filter(v=>v.lang?.toLowerCase().startsWith('ru'));u.voice=vs[0]||null;speechSynthesis.speak(u)}function setClock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}$('#openAdd').onclick=()=>{$('#modal').hidden=false};$('#closeAdd').onclick=()=>{$('#modal').hidden=true};$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};$('#saveCard').onclick=()=>{const de=$('#newDe').value.trim(),ru=$('#newRu').value.trim(),note=$('#newNote').value.trim();if(!de||!ru){$('#msg').textContent='Deutsch und Russisch fehlen.';return}const c={id:'local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),de,ru,note};locals.push(c);cards=[...base,...locals];save();$('#newDe').value=$('#newRu').value=$('#newNote').value='';$('#msg').textContent='Gespeichert ✓';setTimeout(()=>{$('#modal').hidden=true;$('#msg').textContent='';pick()},250)};setClock();setInterval(setClock,30000);pick();setInterval(()=>{if(!current&&dueNow().length)pick();else updateUI()},15000)})();</script></body></html>
