<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Russian Chunks</title><style>:root{--bg:#0b0d12;--card:#151923;--soft:#202635;--text:#f7f8fb;--muted:#9ba5b7;--border:#2b3344;--accent:#8b5cf6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#171b27 0,#0b0d12 42%);color:var(--text);min-height:100vh}.app{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-weight:900;font-size:1.25rem}.sub{color:var(--muted);font-size:.86rem}.pill,.btn,.close{border:0;color:white;background:#252c3b;border-radius:14px;font-weight:800;cursor:pointer}.pill{padding:10px 13px}.hero{border:1px solid var(--border);background:#11151f;border-radius:24px;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:11px}.stat strong{display:block;font-size:1.2rem}.stat span{font-size:.75rem;color:var(--muted)}.card{margin-top:16px;min-height:300px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;position:relative}.side{color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.prompt{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:850;margin-top:10px;line-height:1.12}.answer{display:none;border-top:1px solid var(--border);margin-top:18px;padding-top:18px}.answer.show{display:block}.ru{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:850}.note{color:var(--muted);margin-top:10px}.actions{margin-top:13px}.btn{padding:14px 16px;font-size:1rem;width:100%}.primary{background:linear-gradient(135deg,#7c3aed,#a855f7)}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ratings .btn{padding:12px 6px;font-size:.86rem}.tts{position:absolute;right:15px;top:15px;width:43px;height:43px;border-radius:50%;border:1px solid var(--border);background:var(--soft);color:white;font-size:1.1rem}.garden{margin-top:16px;border:1px solid var(--border);background:#101722;border-radius:20px;padding:16px;text-align:center}.gardenScene{font-size:2.3rem;min-height:54px}.garden strong{display:block}.garden span{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}.bar{height:9px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:12px}.bar>div{height:100%;background:linear-gradient(90deg,#65a30d,#84cc16);width:0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:18px;z-index:10}.modal[hidden]{display:none}.modalCard{width:min(520px,100%);background:#151923;border:1px solid var(--border);border-radius:22px;padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:40px;height:40px;font-size:1.4rem}.modal label{display:block;margin-top:14px;color:var(--muted);font-size:.85rem}.modal input,.modal textarea{width:100%;margin-top:6px;border:1px solid var(--border);background:#0f131b;color:white;border-radius:12px;padding:12px;font:inherit}.msg{color:var(--muted);font-size:.86rem;text-align:center;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:40px 8px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.ratings{grid-template-columns:repeat(2,1fr)}.card{padding:20px}}</style></head><body><main class="app"><div class="top"><div><div class="brand">Russian Chunks</div><div class="sub">Vergessen gehört dazu. Wiederkommen lässt deinen Garten wachsen.</div></div><button class="pill" id="openAdd">＋ Karte</button></div><section class="hero"><div class="stats"><div class="stat"><strong id="due">0</strong><span>fällig</span></div><div class="stat"><strong id="xp">0</strong><span>XP</span></div><div class="stat"><strong id="reviews">0</strong><span>Wiederholungen</span></div><div class="stat"><strong id="level">1</strong><span>Level</span></div></div><div id="study"></div><div class="garden"><div class="gardenScene" id="gardenScene">🌱</div><strong id="gardenTitle">Ein kleiner Anfang</strong><span id="gardenText">Jede Wiederholung gießt deinen Garten.</span><div class="bar"><div id="gardenFill"></div></div></div></section></main><div class="modal" id="modal" hidden><div class="modalCard"><div class="modalHead"><strong>Neue Karte</strong><button class="close" id="closeAdd">×</button></div><label>Deutsch<input id="newDe" placeholder="Ich hab keinen Bock zu kochen."></label><label>Russisch<textarea id="newRu" rows="3" placeholder="Мне влом готовить."></textarea></label><label>Notiz (optional)<input id="newNote" placeholder="z. B. umgangssprachlich"></label><button class="btn primary" id="saveCard" style="margin-top:14px">Karte hinzufügen</button><div class="msg" id="msg"></div></div></div><script>(()=>{const $=s=>document.querySelector(s),KEY='russian-srs-progress-v1',META='russian-srs-meta-v1',LOCAL='russian-srs-local-cards-v1',day=86400000;const base=[{id:'vplom-gotovit',de:'Ich hab keinen Bock zu kochen.',ru:'Мне влом готовить.',note:'влом = salopp: zu lästig / kein Bock'},{id:'stremno-idti',de:'Mir ist etwas mulmig dabei, da allein hinzugehen.',ru:'Мне стрёмно туда идти одной.',note:'стрёмно = sketchy, unangenehm, mulmig'},{id:'nakosyachit-rabota',de:'Ich hab auf der Arbeit Mist gebaut.',ru:'Я накосячила на работе.',note:'накосячить = Mist bauen / verkacken'},{id:'dokopalsya',de:'Warum gehst du mir so auf den Sack?',ru:'Чё ты до меня докопался?',note:'докопаться до кого-то = sich an jemandem festbeißen / nerven'},{id:'zamorochitsya',de:'Ich hab beschlossen, mir die Mühe zu machen und alles selbst zu machen.',ru:'Я решила заморочиться и сама всё сделать.',note:'заморочиться = sich richtig Mühe machen'},{id:'ugorayu',de:'Ich kann darüber nicht mehr vor Lachen.',ru:'Я с этого угораю.',note:'угорать = sich kaputtlachen'},{id:'otmazyvatsya',de:'Hör auf, dich rauszureden.',ru:'Хватит отмазываться.',note:'отмазываться = sich rausreden'},{id:'spalitsya',de:'Er ist mit seiner Lüge aufgeflogen.',ru:'Он спалился на лжи.',note:'спалиться = auffliegen'},{id:'vtirat',de:'Was willst du mir da erzählen?',ru:'Что ты мне втираешь?',note:'втирать = jemandem Quatsch erzählen'},{id:'vyrubitsya',de:'Ich bin nach Hause gekommen und direkt weggepennt.',ru:'Я пришла домой и сразу вырубилась.',note:'вырубиться = wegpennen'}];const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};let progress=load(KEY,{}),meta=load(META,{xp:0,totalReviews:0}),locals=load(LOCAL,[]),cards=[...base,...locals],current=null,revealed=false;const save=()=>{localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem(META,JSON.stringify(meta));localStorage.setItem(LOCAL,JSON.stringify(locals))};const pFor=id=>progress[id]||{due:0,interval:0,ease:2.3,reps:0,lapses:0};const due=()=>cards.filter(c=>pFor(c.id).due<=Date.now()).sort((a,b)=>pFor(a.id).due-pFor(b.id).due);function garden(){const n=meta.totalReviews||0,s=[[0,'🌱','Ein kleiner Anfang'],[10,'🌱🌿','Die ersten Blätter'],[30,'🌿🌷','Es wird grün'],[60,'🌿🌷🌼','Die ersten Blumen'],[100,'🌳🌷🌼','Ein richtiger Garten'],[180,'🌳🌸🌻🪴','Dein Garten blüht'],[300,'🌲🌳🌸🌻🪴','Sprachgarten']];let i=0;s.forEach((x,j)=>{if(n>=x[0])i=j});const cur=s[i],next=s[i+1],pct=next?Math.min(100,(n-cur[0])/(next[0]-cur[0])*100):100;$('#gardenScene').textContent=cur[1];$('#gardenTitle').textContent=cur[2];$('#gardenText').textContent=next?`Noch ${next[0]-n} Wiederholungen bis zur nächsten Stufe. Fehler kosten nichts.`:'Dein Garten wächst mit jeder Wiederholung weiter.';$('#gardenFill').style.width=pct+'%'}function stats(){$('#due').textContent=due().length;$('#xp').textContent=meta.xp||0;$('#reviews').textContent=meta.totalReviews||0;$('#level').textContent=Math.floor((meta.xp||0)/100)+1;garden()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pick(){current=due()[0]||null;revealed=false;render()}function render(){stats();if(!current){$('#study').innerHTML='<div class="empty"><div style="font-size:2.4rem">🌿✨</div><h2>Für jetzt alles erledigt.</h2><p>Du kannst trotzdem einen zufälligen Chunk üben.</p><button class="btn primary" id="random">Zufälligen Chunk üben</button></div>';$('#random').onclick=()=>{current=cards[Math.floor(Math.random()*cards.length)];revealed=false;render()};return}$('#study').innerHTML=`<div class="card"><button class="tts" id="tts">🔊</button><div class="side">Deutsch → Russisch</div><div class="prompt">${esc(current.de)}</div><div class="answer ${revealed?'show':''}"><div class="ru">${esc(current.ru)}</div>${current.note?`<div class="note">${esc(current.note)}</div>`:''}</div></div><div class="actions">${revealed?'<div class="ratings"><button class="btn" data-r="again">Nochmal</button><button class="btn" data-r="hard">Schwer</button><button class="btn" data-r="good">Gut</button><button class="btn" data-r="easy">Leicht</button></div>':'<button class="btn primary" id="reveal">Antwort zeigen</button>'}</div>`;$('#tts').onclick=speak;if($('#reveal'))$('#reveal').onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r))}function rate(r){const p=pFor(current.id);let days=0,xp=0;if(r==='again'){days=.01;p.interval=.01;p.ease=Math.max(1.3,p.ease-.2);p.lapses++;xp=6}else if(r==='hard'){days=Math.max(.25,(p.interval||.2)*1.3);p.interval=days;p.ease=Math.max(1.3,p.ease-.1);xp=8}else if(r==='good'){days=p.reps===0?1:p.reps===1?3:Math.max(2,(p.interval||1)*p.ease);p.interval=days;xp=10}else{days=p.reps===0?3:p.reps===1?7:Math.max(4,(p.interval||1)*p.ease*1.3);p.interval=days;p.ease+=.08;xp=12}p.reps++;p.due=Date.now()+days*day;progress[current.id]=p;meta.totalReviews=(meta.totalReviews||0)+1;meta.xp=(meta.xp||0)+xp;save();pick()}function speak(){if(!current||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.ru);u.lang='ru-RU';u.rate=.9;const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('ru'));u.voice=v[0]||null;speechSynthesis.speak(u)}$('#openAdd').onclick=()=>{$('#modal').hidden=false;setTimeout(()=>$('#newDe').focus(),50)};$('#closeAdd').onclick=()=>{$('#modal').hidden=true};$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};$('#saveCard').onclick=()=>{const de=$('#newDe').value.trim(),ru=$('#newRu').value.trim(),note=$('#newNote').value.trim();if(!de||!ru){$('#msg').textContent='Deutsch und Russisch fehlen noch.';return}const c={id:'local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),de,ru,note};locals.push(c);cards=[...base,...locals];save();$('#newDe').value='';$('#newRu').value='';$('#newNote').value='';$('#msg').textContent='Gespeichert ✓';setTimeout(()=>{$('#modal').hidden=true;$('#msg').textContent='';current=c;revealed=false;render()},250)};pick()})();</script></body></html>
