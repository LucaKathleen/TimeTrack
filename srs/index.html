<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b1d"><title>Russian SRS</title><style>:root{--bg:#090b1d;--panel:#10142d;--panel2:#171b3c;--line:#34336d;--text:#f0efff;--muted:#aaa8d2;--purple:#7662e8;--pink:#ff657e;--orange:#e99b3e;--green:#26bd8c;--cyan:#2eb9cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:radial-gradient(circle at 25% 0,#1a1744 0,#0d1027 34%,#080a18 78%);image-rendering:pixelated}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;letter-spacing:.04em;text-shadow:3px 3px 0 #342b75}.add,.btn,.close{font:inherit;color:var(--text);font-weight:800;border:2px solid var(--line);background:#151936;box-shadow:3px 3px 0 #070918;cursor:pointer}.add{padding:10px 14px;border-radius:8px}.layout{display:grid;grid-template-columns:190px 1fr;gap:14px}.panel{background:linear-gradient(180deg,rgba(20,24,55,.96),rgba(11,14,34,.96));border:2px solid var(--line);box-shadow:5px 5px 0 rgba(2,3,12,.8);border-radius:8px}.today{padding:14px;height:max-content}.today h3{margin:0 0 12px;font-size:.9rem}.countrow{display:flex;justify-content:space-between;color:var(--muted);padding:6px 0}.dot{display:inline-block;width:9px;height:9px;margin-right:7px}.d1{background:#7967ff}.d2{background:#ef9a3d}.d3{background:#35c7b2}.main{padding:16px}.card{min-height:310px;padding:22px;display:flex;flex-direction:column;justify-content:center;position:relative}.badge{position:absolute;top:14px;left:14px;color:#b7aefc;background:#29275b;padding:6px 9px;border-radius:12px;font-size:.72rem}.prompt{text-align:center;font-size:clamp(1.65rem,7vw,2.7rem);font-weight:900;margin:35px 0 16px}.answer{display:none;text-align:center;border-top:2px solid #33375e;padding-top:18px}.answer.show{display:block}.ru{font-size:clamp(1.55rem,6vw,2.3rem);font-weight:900}.note{color:var(--muted);margin-top:10px}.tts{position:absolute;right:14px;top:14px;border:2px solid var(--line);background:#232653;color:white;width:42px;height:42px;border-radius:7px}.actions{margin-top:12px}.btn{width:100%;padding:14px;border-radius:7px}.primary{background:#5143a8}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.ratings small{display:block;margin-top:4px;opacity:.75}.again{background:#a33a52;border-color:#e85b73}.hard{background:#9a5b1f;border-color:#e9a143}.good{background:#13795e;border-color:#29c798}.easy{background:#176d80;border-color:#2dc0d7}.catpanel{margin-top:14px;padding:15px;display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center;overflow:hidden}.room{height:150px;position:relative;background:linear-gradient(#171942 0 62%,#3a2540 62%);border:2px solid #2d3164;overflow:hidden}.window{position:absolute;left:8px;top:8px;width:70px;height:66px;background:linear-gradient(#121b4c,#49274e);border:4px solid #272951}.window:after{content:'✦  ·  ✦';position:absolute;color:#9da3ff;font-size:8px;top:8px;left:8px}.floor{position:absolute;bottom:0;left:0;right:0;height:57px;background:repeating-linear-gradient(90deg,#4a2c42 0 28px,#34223a 28px 30px)}.cat{--c:#77738c;position:absolute;width:74px;height:50px;left:72px;bottom:34px;background:var(--c);border:4px solid #252238;border-radius:48% 48% 42% 42%;filter:drop-shadow(3px 3px 0 #151326);transform-origin:center bottom}.cat:before{content:'';position:absolute;width:43px;height:40px;left:34px;top:-24px;background:var(--c);border:4px solid #252238;border-radius:45%}.cat:after{content:'•  •';white-space:pre;position:absolute;left:48px;top:-13px;color:#f5c75f;font-size:14px;font-weight:900}.ear1,.ear2{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:20px solid #77738c;top:-35px;z-index:2}.ear1{left:36px;transform:rotate(-14deg)}.ear2{left:64px;transform:rotate(14deg)}.tail{position:absolute;width:37px;height:15px;border:6px solid #77738c;border-left:0;border-radius:0 20px 20px 0;left:4px;bottom:37px}.bowl{position:absolute;bottom:15px;left:105px;width:44px;height:14px;background:#385079;border:3px solid #1d223e;border-radius:3px 3px 14px 14px}.food{position:absolute;bottom:26px;left:114px;width:26px;height:7px;background:#a96048}.cat.hungry{animation:beg .7s steps(2,end) infinite}.cat.waiting{animation:idle 1.7s steps(2,end) infinite}.cat.full{animation:purr 1.1s steps(2,end) infinite}.cat.full~.bowl .food{display:block}.cat.hungry~.bowl .food,.cat.waiting~.bowl .food{display:none}@keyframes beg{50%{transform:translateY(-5px)}}@keyframes idle{50%{transform:translateX(2px)}}@keyframes purr{50%{transform:translateY(2px) scaleY(.97)}}.catcopy strong{font-size:1.05rem}.catcopy p{color:var(--muted);line-height:1.45;margin:7px 0 0}.status{color:#ff7890;margin-top:7px;font-weight:900}.modal{position:fixed;inset:0;background:#050611dd;display:grid;place-items:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modalCard{width:min(500px,100%);padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px}.modal label{display:block;color:var(--muted);margin-top:12px}.modal input,.modal textarea{width:100%;margin-top:5px;padding:11px;background:#0b0e22;border:2px solid var(--line);color:white;font:inherit}.msg,.empty{color:var(--muted);text-align:center}.empty{padding:40px 8px}.hint{text-align:center;color:#7777a8;font-size:.72rem;margin-top:12px}@media(max-width:680px){.app{padding:11px}.layout{display:block}.today{margin-bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.today h3{grid-column:1/-1}.countrow{font-size:.72rem}.main{padding:11px}.ratings{grid-template-columns:repeat(2,1fr)}.catpanel{grid-template-columns:140px 1fr}.room{height:130px}.cat{left:48px}.bowl{left:83px}.food{left:92px}.brand{font-size:1.35rem}}</style></head><body><main class="app"><div class="top"><div class="brand">✦ Russian SRS ✦</div><button class="add" id="openAdd">＋ Karte</button></div><div class="layout"><aside class="panel today"><h3>▣ Heute</h3><div class="countrow"><span><i class="dot d1"></i>Jetzt</span><b id="due">0</b></div><div class="countrow"><span><i class="dot d2"></i>Heute</span><b id="todayOpen">0</b></div><div class="countrow"><span><i class="dot d3"></i>Gelernt</span><b id="reviews">0</b></div></aside><section><div class="panel main"><div id="study"></div></div><div class="panel catpanel"><div class="room"><div class="window"></div><div class="floor"></div><div class="tail"></div><div class="cat hungry" id="cat"><i class="ear1"></i><i class="ear2"></i></div><div class="bowl"><i class="food"></i></div></div><div class="catcopy"><strong id="catTitle">Deine Katze hat Hunger.</strong><div class="status" id="catStatus">HUNGRIG</div><p id="catText">Erledige die heutigen Wiederholungen, damit sie ihr Futter bekommt.</p></div></div><div class="hint">Lernschritte: 1 Min → 10 Min → morgen · Nochmal setzt die Lernphase zurück.</div></section></div></main><div class="modal" id="modal" hidden><div class="panel modalCard"><div class="modalHead"><strong>＋ Neue Karte</strong><button class="close" id="closeAdd">×</button></div><label>Deutsch<input id="newDe"></label><label>Russisch<textarea id="newRu" rows="3"></textarea></label><label>Notiz (optional)<input id="newNote"></label><button class="btn primary" id="saveCard" style="margin-top:14px">Karte hinzufügen</button><div class="msg" id="msg"></div></div></div><script>(()=>{const $=s=>document.querySelector(s),KEY='russian-srs-progress-v1',META='russian-srs-meta-v1',LOCAL='russian-srs-local-cards-v1',MIN=60000,DAY=86400000;const base=[{id:'vplom-gotovit',de:'Ich hab keinen Bock zu kochen.',ru:'Мне влом готовить.',note:'влом = salopp: zu lästig / kein Bock'},{id:'stremno-idti',de:'Mir ist etwas mulmig dabei, da allein hinzugehen.',ru:'Мне стрёмно туда идти одной.',note:'стрёмно = sketchy, unangenehm, mulmig'},{id:'nakosyachit-rabota',de:'Ich hab auf der Arbeit Mist gebaut.',ru:'Я накосячила на работе.',note:'накосячить = Mist bauen / verkacken'},{id:'dokopalsya',de:'Warum gehst du mir so auf den Sack?',ru:'Чё ты до меня докопался?',note:'докопаться = sich an jemandem festbeißen / nerven'},{id:'zamorochitsya',de:'Ich hab beschlossen, mir die Mühe zu machen und alles selbst zu machen.',ru:'Я решила заморочиться и сама всё сделать.',note:'заморочиться = sich richtig Mühe machen'},{id:'ugorayu',de:'Ich kann darüber nicht mehr vor Lachen.',ru:'Я с этого угораю.',note:'угорать = sich kaputtlachen'},{id:'otmazyvatsya',de:'Hör auf, dich rauszureden.',ru:'Хватит отмазываться.',note:'отмазываться = sich rausreden'},{id:'spalitsya',de:'Er ist mit seiner Lüge aufgeflogen.',ru:'Он спалился на лжи.',note:'спалиться = auffliegen'},{id:'vtirat',de:'Was willst du mir da erzählen?',ru:'Что ты мне втираешь?',note:'втирать = jemandem Quatsch erzählen'},{id:'vyrubitsya',de:'Ich bin nach Hause gekommen und direkt weggepennt.',ru:'Я пришла домой и сразу вырубилась.',note:'вырубиться = wegpennen'}];const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};let progress=load(KEY,{}),meta=load(META,{totalReviews:0}),locals=load(LOCAL,[]),cards=[...base,...locals],current=null,revealed=false;function fresh(){return{state:'learning',correctStreak:0,due:0,interval:0,ease:2.5,reviews:0,lapses:0}}function pFor(id){const o=progress[id];if(!o)return fresh();if(o.state)return o;return{state:(o.reps||0)>0?'review':'learning',correctStreak:0,due:o.due||0,interval:Math.max(1,Math.round(o.interval||1)),ease:o.ease||2.5,reviews:o.reps||0,lapses:o.lapses||0}}function save(){localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem(META,JSON.stringify(meta));localStorage.setItem(LOCAL,JSON.stringify(locals))}function endToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime()}function dueNow(){return cards.filter(c=>pFor(c.id).due<=Date.now()).sort((a,b)=>pFor(a.id).due-pFor(b.id).due)}function openToday(){return cards.filter(c=>pFor(c.id).due<=endToday())}function nextDue(){return cards.map(c=>pFor(c.id).due).filter(x=>x>Date.now()).sort((a,b)=>a-b)[0]||null}function fmt(ms){if(ms<=90000)return'1 Min';if(ms<60*MIN)return Math.max(1,Math.round(ms/MIN))+' Min';if(ms<DAY)return Math.round(ms/(60*MIN))+' Std';const d=Math.round(ms/DAY);return d+' Tag'+(d===1?'':'e')}function stats(){$('#due').textContent=dueNow().length;$('#todayOpen').textContent=openToday().length;$('#reviews').textContent=meta.totalReviews||0;catStatus()}function catStatus(){const n=dueNow().length,t=openToday().length,c=$('#cat');c.className='cat';if(t===0){c.classList.add('full');$('#catTitle').textContent='Deine Katze ist satt.';$('#catStatus').textContent='ZUFRIEDEN';$('#catStatus').style.color='#50d7a5';$('#catText').textContent='Alles für heute erledigt. Sie hat gefressen und macht es sich gemütlich.'}else if(n){c.classList.add('hungry');$('#catTitle').textContent='Deine Katze hat Hunger.';$('#catStatus').textContent='HUNGRIG';$('#catStatus').style.color='#ff7890';$('#catText').textContent=n+' Karte'+(n===1?' ist':'n sind')+' jetzt fällig. Noch '+t+' Wiederholung'+(t===1?'':'en')+' heute.'}else{c.classList.add('waiting');$('#catTitle').textContent='Sie wartet aufs Futter.';$('#catStatus').textContent='WARTET';$('#catStatus').style.color='#e8b15c';const nd=nextDue();$('#catText').textContent=nd?'Nächste Lernkarte in '+fmt(nd-Date.now())+'. Danach kannst du weiterfüttern.':'Heute kommt noch eine Wiederholung.'}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function intervals(p){if(p.state==='learning'||p.state==='relearning'){return p.correctStreak===0?{again:'1 Min',hard:'6 Min',good:'10 Min',easy:'10 Min'}:{again:'1 Min',hard:'1 Tag',good:'1 Tag',easy:'1 Tag'}}const i=Math.max(1,p.interval||1),e=Math.max(1.3,p.ease||2.5);return{again:'1 Min',hard:Math.max(1,Math.round(i*1.2))+' T',good:Math.max(i+1,Math.round(i*e))+' T',easy:Math.max(i+2,Math.round(i*e*1.3))+' T'}}function pick(){current=dueNow()[0]||null;revealed=false;render()}function render(){stats();if(!current){const nd=nextDue(),today=openToday().length>0;$('#study').innerHTML='<div class="empty"><h2>'+(today?'Kurz warten…':'Für heute fertig ✦')+'</h2><p>'+(today&&nd?'Nächste Karte in '+fmt(nd-Date.now())+'.':'Deine Katze ist satt. Morgen geht es weiter.')+'</p>'+(today?'<button class="btn" id="refresh">Jetzt prüfen</button>':'<button class="btn primary" id="random">Zufällig üben</button>')+'</div>';if($('#refresh'))$('#refresh').onclick=pick;if($('#random'))$('#random').onclick=()=>{current=cards[Math.floor(Math.random()*cards.length)];render()};return}const p=pFor(current.id),iv=intervals(p),phase=p.state==='review'?'↻ Wiederholung':p.state==='relearning'?'↻ Wieder lernen':'✦ Neu lernen';$('#study').innerHTML=`<div class="card panel"><div class="badge">${phase}</div><button class="tts" id="tts">♪</button><div class="prompt">${esc(current.de)}</div><div class="answer ${revealed?'show':''}"><div class="ru">${esc(current.ru)}</div>${current.note?`<div class="note">${esc(current.note)}</div>`:''}</div></div><div class="actions">${revealed?`<div class="ratings"><button class="btn again" data-r="again">Nochmal<small>${iv.again}</small></button><button class="btn hard" data-r="hard">Schwer<small>${iv.hard}</small></button><button class="btn good" data-r="good">Gut<small>${iv.good}</small></button><button class="btn easy" data-r="easy">Einfach<small>${iv.easy}</small></button></div>`:'<button class="btn primary" id="reveal">Antwort zeigen</button>'}</div>`;$('#tts').onclick=speak;if($('#reveal'))$('#reveal').onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r))}function rate(r){let p=pFor(current.id);const learning=p.state==='learning'||p.state==='relearning';if(learning){if(r==='again'){p.correctStreak=0;p.due=Date.now()+MIN}else if(r==='hard'){p.correctStreak=0;p.due=Date.now()+6*MIN}else{p.correctStreak=(p.correctStreak||0)+1;if(p.correctStreak>=2){p.state='review';p.interval=1;p.due=Date.now()+DAY;p.correctStreak=0}else p.due=Date.now()+10*MIN}}else{const i=Math.max(1,p.interval||1);if(r==='again'){p.state='relearning';p.correctStreak=0;p.lapses=(p.lapses||0)+1;p.ease=Math.max(1.3,(p.ease||2.5)-.2);p.due=Date.now()+MIN}else if(r==='hard'){p.interval=Math.max(1,Math.round(i*1.2));p.ease=Math.max(1.3,(p.ease||2.5)-.1);p.due=Date.now()+p.interval*DAY}else if(r==='good'){p.interval=Math.max(i+1,Math.round(i*(p.ease||2.5)));p.due=Date.now()+p.interval*DAY}else{p.ease=(p.ease||2.5)+.08;p.interval=Math.max(i+2,Math.round(i*p.ease*1.3));p.due=Date.now()+p.interval*DAY}}p.reviews=(p.reviews||0)+1;progress[current.id]=p;meta.totalReviews=(meta.totalReviews||0)+1;save();pick()}function speak(){if(!current||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.ru);u.lang='ru-RU';u.rate=.9;const vs=speechSynthesis.getVoices().filter(v=>v.lang?.toLowerCase().startsWith('ru'));u.voice=vs[0]||null;speechSynthesis.speak(u)}$('#openAdd').onclick=()=>{$('#modal').hidden=false};$('#closeAdd').onclick=()=>{$('#modal').hidden=true};$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};$('#saveCard').onclick=()=>{const de=$('#newDe').value.trim(),ru=$('#newRu').value.trim(),note=$('#newNote').value.trim();if(!de||!ru){$('#msg').textContent='Deutsch und Russisch fehlen.';return}const c={id:'local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),de,ru,note};locals.push(c);cards=[...base,...locals];save();$('#newDe').value=$('#newRu').value=$('#newNote').value='';$('#msg').textContent='Gespeichert ✓';setTimeout(()=>{$('#modal').hidden=true;$('#msg').textContent='';pick()},250)};pick();setInterval(()=>{if(!current&&dueNow().length)pick();else stats()},15000)})();</script></body></html>
