<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b1d"><title>Russian SRS</title><style>:root{--bg:#080a18;--panel:#11152e;--line:#383774;--text:#f2f1ff;--muted:#a9a7cf;--purple:#7868ee;--red:#bf4058;--orange:#a96a23;--green:#167d62;--cyan:#18758a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#201a51 0,#0d1026 35%,#080a18 75%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}.app{max-width:1180px;margin:auto;padding:16px}.title{text-align:center;font-size:clamp(1.6rem,5vw,2.5rem);font-weight:900;text-shadow:3px 3px 0 #342b75;margin:4px 0 16px}.grid{display:grid;grid-template-columns:260px 1fr 220px;gap:14px}.panel{background:linear-gradient(180deg,#171b3a,#0e1128);border:2px solid var(--line);border-radius:10px;box-shadow:5px 5px 0 #050611}.today,.sidebox,.statusbox{padding:15px}.today h3,.sidebox h3{margin:0 0 12px}.row{display:flex;justify-content:space-between;color:var(--muted);padding:6px 0}.roomWrap{margin-top:14px;position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#171737}.roomWrap img{display:block;width:100%;image-rendering:pixelated;animation:breathe 2.4s steps(2,end) infinite}.speech{position:absolute;left:14px;top:14px;background:#0c1028e6;border:2px solid #5c4f99;border-radius:8px;padding:9px 11px;font-size:.76rem;line-height:1.35;max-width:150px}.card{padding:18px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}.badge{position:absolute;left:16px;top:15px;background:#2a2860;color:#b8b0ff;padding:6px 9px;border-radius:14px;font-size:.72rem}.tts{position:absolute;right:16px;top:15px;width:42px;height:42px;border:2px solid var(--line);background:#252856;color:#fff;border-radius:8px}.prompt{text-align:center;font-weight:900;font-size:clamp(1.8rem,7vw,3rem);margin:38px 0 20px}.answer{display:none;border-top:2px solid #33365e;padding-top:20px;text-align:center}.answer.show{display:block}.ru{font-weight:900;font-size:clamp(1.6rem,6vw,2.4rem)}.note{color:var(--muted);margin-top:10px}.btn,.add{font:inherit;color:#fff;font-weight:900;border:2px solid var(--line);border-radius:9px;padding:13px;cursor:pointer}.btn{width:100%;background:#302b75}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.ratings small{display:block;margin-top:3px;opacity:.75}.again{background:var(--red);border-color:#f0647c}.hard{background:var(--orange);border-color:#eda64e}.good{background:var(--green);border-color:#2fc99b}.easy{background:var(--cyan);border-color:#38c6df}.sidecol{display:grid;gap:14px;align-content:start}.next{font-size:1.25rem;color:#bdaeff}.streak{font-size:2rem;font-weight:900}.dots{letter-spacing:5px;color:#7967ff}.bottom{display:grid;grid-template-columns:260px 1fr 220px;gap:14px;margin-top:14px}.status{font-size:1.25rem;color:#ff7188;font-weight:900}.add{background:#3a2e86;width:100%;height:100%;min-height:110px;font-size:1.05rem}.bars{display:flex;align-items:end;gap:7px;height:55px;margin-top:12px}.bars i{display:block;width:10px;background:#765cff}.bars i:nth-child(1){height:18px}.bars i:nth-child(2){height:42px}.bars i:nth-child(3){height:27px}.bars i:nth-child(4){height:50px}.bars i:nth-child(5){height:35px}.bars i:nth-child(6){height:22px}.modal{position:fixed;inset:0;background:#050611dd;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.modalCard{width:min(500px,100%);padding:18px}.modal label{display:block;color:var(--muted);margin-top:12px}.modal input,.modal textarea{width:100%;margin-top:5px;background:#0b0e22;border:2px solid var(--line);color:#fff;padding:11px;font:inherit}.close{float:right}.empty{text-align:center;color:var(--muted);padding:40px}@keyframes breathe{50%{transform:translateY(2px)}}@media(max-width:860px){.grid{grid-template-columns:1fr}.sidecol{grid-template-columns:repeat(3,1fr)}.bottom{grid-template-columns:1fr}.today{display:none}.roomWrap{max-height:260px}.roomWrap img{object-fit:cover}.card{min-height:360px}.ratings{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.app{padding:10px}.sidecol{grid-template-columns:1fr 1fr}.sidecol .quote{display:none}.roomWrap{max-height:230px}.speech{font-size:.68rem;max-width:130px}.card{padding:14px}.title{font-size:1.45rem}}</style></head><body><main class="app"><div class="title">✦ Russian SRS ✦</div><div class="grid"><section><div class="panel today"><h3>▣ Heute</h3><div class="row"><span>Neu</span><b id="newCount">0</b></div><div class="row"><span>Lernen</span><b id="learnCount">0</b></div><div class="row"><span>Wiederholen</span><b id="reviewCount">0</b></div></div><div class="roomWrap"><img src="./cat-room.svg" alt="Pixel-Art Katze im gemütlichen Zimmer"><div class="speech" id="speech">Noch ein paar Karten… danach gibt's Futter.</div></div></section><section><div class="panel card"><div class="badge" id="phase">Wiederholung</div><button class="tts" id="tts">♪</button><div id="study"></div></div></section><aside class="sidecol"><div class="panel sidebox"><h3>◷ Nächste Karte</h3><div class="next" id="nextDue">jetzt</div></div><div class="panel sidebox"><h3>Streak</h3><div class="streak" id="streak">0 Tage</div><div class="dots">● ● ● ● ● ○ ○</div></div><div class="panel sidebox quote"><h3>❝</h3><div style="color:#a99cff">Маленькие шаги каждый день.</div></div></aside></div><div class="bottom"><div class="panel statusbox"><div style="color:var(--muted)">Katzenstatus</div><div class="status" id="catStatus">Hungrig</div><div id="catText" style="color:var(--muted);margin-top:7px">Offene Wiederholungen warten.</div></div><div class="panel statusbox"><div style="font-weight:900">Heute gelernt</div><div><b id="doneToday">0</b> Karten</div><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><button class="add" id="openAdd">＋ Karte hinzufügen</button></div></main><div class="modal" id="modal" hidden><div class="panel modalCard"><button class="btn close" id="closeAdd" style="width:auto">×</button><h3>Neue Karte</h3><label>Deutsch<input id="de"></label><label>Russisch<textarea id="ru" rows="3"></textarea></label><label>Notiz<input id="note"></label><button class="btn" id="saveCard" style="margin-top:14px">Speichern</button><div id="msg" style="color:var(--muted);margin-top:8px"></div></div></div><script>(()=>{const $=s=>document.querySelector(s),K='russian-srs-progress-v1',M='russian-srs-meta-v1',L='russian-srs-local-cards-v1',MIN=60000,DAY=86400000;base=[{id:'a',de:'Ich hab keinen Bock zu kochen.',ru:'Мне влом готовить.',note:'влом = salopp: kein Bock'},{id:'b',de:'Mir ist mulmig, da allein hinzugehen.',ru:'Мне стрёмно туда идти одной.',note:'стрёмно = mulmig / sketchy'},{id:'c',de:'Ich hab Mist gebaut.',ru:'Я накосячила.',note:'накосячить = Mist bauen'},{id:'d',de:'Warum gehst du mir auf den Sack?',ru:'Чё ты до меня докопался?',note:'докопаться = jemanden nerven'},{id:'e',de:'Hör auf, dich rauszureden.',ru:'Хватит отмазываться.',note:'отмазываться = sich rausreden'}];const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};let p=load(K,{}),meta=load(M,{totalReviews:0,reviewsToday:0,reviewDay:''}),local=load(L,[]),cards=[...base,...local],cur=null,revealed=false;function fresh(){return{state:'learning',correctStreak:0,due:0,interval:0,ease:2.5,reviews:0,lapses:0}}function pf(id){let x=p[id];if(!x)return fresh();if(x.state)return x;return{state:(x.reps||0)>0?'review':'learning',correctStreak:0,due:x.due||0,interval:Math.max(1,Math.round(x.interval||1)),ease:x.ease||2.5,reviews:x.reps||0,lapses:x.lapses||0}}function save(){localStorage.setItem(K,JSON.stringify(p));localStorage.setItem(M,JSON.stringify(meta));localStorage.setItem(L,JSON.stringify(local))}function endToday(){let d=new Date();d.setHours(23,59,59,999);return d.getTime()}function due(){return cards.filter(c=>pf(c.id).due<=Date.now()).sort((a,b)=>pf(a.id).due-pf(b.id).due)}function todayOpen(){return cards.filter(c=>pf(c.id).due<=endToday())}function fmt(ms){if(ms<=90000)return'1 Min';if(ms<60*MIN)return Math.max(1,Math.round(ms/MIN))+' Min';if(ms<DAY)return Math.round(ms/3600000)+' Std';let d=Math.round(ms/DAY);return d+' Tag'+(d===1?'':'e')}function next(){return cards.map(c=>pf(c.id).due).filter(x=>x>Date.now()).sort((a,b)=>a-b)[0]||null}function stats(){let n=0,l=0,r=0;cards.forEach(c=>{let x=pf(c.id);if(x.state==='learning')n++;else if(x.state==='relearning')l++;else r++});$('#newCount').textContent=n;$('#learnCount').textContent=l;$('#reviewCount').textContent=r;$('#doneToday').textContent=meta.reviewsToday||0;let open=todayOpen().length,now=due().length;if(open===0){$('#catStatus').textContent='Zufrieden';$('#catStatus').style.color='#55d8a9';$('#catText').textContent='Alles für heute erledigt.';$('#speech').textContent='Mrrr… satt. Morgen wieder.'}else if(now){$('#catStatus').textContent='Hungrig';$('#catStatus').style.color='#ff7188';$('#catText').textContent=open+' Wiederholungen heute offen.';$('#speech').textContent='Noch '+open+' Karten… danach gibt’s Futter.'}else{$('#catStatus').textContent='Wartet';$('#catStatus').style.color='#e9ae55';$('#catText').textContent='Nächste Lernkarte kommt gleich.';$('#speech').textContent='Ich warte noch ein bisschen…'}let nd=next();$('#nextDue').textContent=now?'jetzt':nd?'in '+fmt(nd-Date.now()):'morgen';$('#streak').textContent=(meta.streak||0)+' Tage'}function ints(x){if(x.state==='learning'||x.state==='relearning')return x.correctStreak===0?{a:'1 Min',h:'6 Min',g:'10 Min',e:'10 Min'}:{a:'1 Min',h:'1 Tag',g:'1 Tag',e:'1 Tag'};let i=Math.max(1,x.interval||1),e=x.ease||2.5;return{a:'1 Min',h:Math.max(1,Math.round(i*1.2))+' T',g:Math.max(i+1,Math.round(i*e))+' T',e:Math.max(i+2,Math.round(i*e*1.3))+' T'}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pick(){cur=due()[0]||null;revealed=false;render()}function render(){stats();if(!cur){$('#phase').textContent=todayOpen().length?'Lernpause':'Fertig';$('#study').innerHTML='<div class="empty"><h2>'+(todayOpen().length?'Kurz warten…':'Für heute fertig ✦')+'</h2><p>'+(todayOpen().length?'Die nächste Lernkarte kommt automatisch.':'Die Katze ist satt.')+'</p></div>';return}let x=pf(cur.id),iv=ints(x);$('#phase').textContent=x.state==='review'?'↻ Wiederholung':x.state==='relearning'?'↻ Wieder lernen':'✦ Neu lernen';$('#study').innerHTML=`<div class="prompt">${esc(cur.de)}</div><div class="answer ${revealed?'show':''}"><div class="ru">${esc(cur.ru)}</div>${cur.note?`<div class="note">${esc(cur.note)}</div>`:''}</div>${revealed?`<div class="ratings"><button class="btn again" data-r="again">Nochmal<small>${iv.a}</small></button><button class="btn hard" data-r="hard">Schwer<small>${iv.h}</small></button><button class="btn good" data-r="good">Gut<small>${iv.g}</small></button><button class="btn easy" data-r="easy">Einfach<small>${iv.e}</small></button></div>`:'<button class="btn" id="show">Antwort zeigen</button>'}`;if($('#show'))$('#show').onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r))}function rate(r){let x=pf(cur.id),learn=x.state!=='review';if(learn){if(r==='again'){x.correctStreak=0;x.due=Date.now()+MIN}else if(r==='hard'){x.correctStreak=0;x.due=Date.now()+6*MIN}else{x.correctStreak=(x.correctStreak||0)+1;if(x.correctStreak>=2){x.state='review';x.interval=1;x.due=Date.now()+DAY;x.correctStreak=0}else x.due=Date.now()+10*MIN}}else{let i=Math.max(1,x.interval||1);if(r==='again'){x.state='relearning';x.correctStreak=0;x.lapses=(x.lapses||0)+1;x.ease=Math.max(1.3,(x.ease||2.5)-.2);x.due=Date.now()+MIN}else if(r==='hard'){x.interval=Math.max(1,Math.round(i*1.2));x.due=Date.now()+x.interval*DAY}else if(r==='good'){x.interval=Math.max(i+1,Math.round(i*(x.ease||2.5)));x.due=Date.now()+x.interval*DAY}else{x.interval=Math.max(i+2,Math.round(i*(x.ease||2.5)*1.3));x.due=Date.now()+x.interval*DAY}}p[cur.id]=x;let d=new Date().toISOString().slice(0,10);if(meta.reviewDay!==d){meta.reviewDay=d;meta.reviewsToday=0}meta.reviewsToday=(meta.reviewsToday||0)+1;meta.totalReviews=(meta.totalReviews||0)+1;save();pick()}$('#tts').onclick=()=>{if(!cur||!speechSynthesis)return;let u=new SpeechSynthesisUtterance(cur.ru);u.lang='ru-RU';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};$('#openAdd').onclick=()=>$('#modal').hidden=false;$('#closeAdd').onclick=()=>$('#modal').hidden=true;$('#saveCard').onclick=()=>{let de=$('#de').value.trim(),ru=$('#ru').value.trim(),note=$('#note').value.trim();if(!de||!ru){$('#msg').textContent='Deutsch und Russisch fehlen.';return}local.push({id:'local-'+Date.now(),de,ru,note});cards=[...base,...local];save();$('#modal').hidden=true;$('#de').value=$('#ru').value=$('#note').value='';pick()};pick();setInterval(()=>{if(!cur&&due().length)pick();else stats()},15000)})();</script></body></html>
